<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stockholm Syndrome Self-Evaluation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #7F77DD;
      --accent-light: #EEEDFE;
      --accent-dark: #3C3489;
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #efefed;
      --text-primary: #1a1a18;
      --text-secondary: #6b6b68;
      --text-tertiary: #9b9b98;
      --border-tertiary: rgba(0,0,0,0.12);
      --border-secondary: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1e1e1c;
        --bg-secondary: #2a2a28;
        --bg-tertiary: #242422;
        --text-primary: #f0ede8;
        --text-secondary: #a8a8a4;
        --text-tertiary: #6e6e6a;
        --border-tertiary: rgba(255,255,255,0.10);
        --border-secondary: rgba(255,255,255,0.18);
        --accent-light: #2a2860;
        --accent-dark: #b0aaf5;
      }
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-tertiary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    #app {
      width: 100%;
      max-width: 640px;
    }

    .lang-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .lang-btn {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-secondary);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-sans);
    }

    .lang-btn.active,
    .lang-btn:hover {
      background: var(--accent-light);
      color: var(--accent-dark);
      border-color: var(--accent);
    }

    .header {
      margin-bottom: 1.5rem;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .progress-wrap {
      margin-bottom: 1.5rem;
    }

    .progress-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 4px;
      background: var(--border-tertiary);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.3s;
    }

    .question-card {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-tertiary);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .q-num {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }

    .q-text {
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .opt {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-tertiary);
      cursor: pointer;
      transition: all 0.15s;
      font-size: 14px;
      color: var(--text-primary);
      background: transparent;
      width: 100%;
      text-align: left;
      font-family: var(--font-sans);
    }

    .opt:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .opt.selected {
      border-color: var(--accent);
      background: var(--accent-light);
      color: var(--accent-dark);
    }

    .opt-radio {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1.5px solid var(--border-secondary);
      flex-shrink: 0;
      margin-top: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .opt.selected .opt-radio {
      border-color: var(--accent);
      background: var(--accent);
    }

    .opt.selected .opt-radio::after {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .btn {
      padding: 8px 20px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-secondary);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-sans);
      background: transparent;
      color: var(--text-primary);
    }

    .btn:hover {
      background: var(--bg-secondary);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result {
      background: var(--bg-primary);
      border: 0.5px solid var(--border-tertiary);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }

    .score-ring {
      width: 80px;
      height: 80px;
      margin: 0 auto 1rem;
      display: block;
    }

    .score-num {
      font-size: 28px;
      font-weight: 500;
      text-align: center;
      color: var(--text-primary);
    }

    .score-num span {
      font-size: 16px;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .score-label {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 1rem;
    }

    .result-level {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .result-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .breakdown {
      margin: 1rem 0;
    }

    .breakdown-title {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .bar-label {
      min-width: 140px;
      color: var(--text-secondary);
      text-align: right;
    }

    .bar-bg {
      flex: 1;
      height: 6px;
      background: var(--border-tertiary);
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 3px;
    }

    .bar-val {
      min-width: 28px;
      color: var(--text-tertiary);
      font-size: 11px;
    }

    .disclaimer {
      font-size: 12px;
      color: var(--text-tertiary);
      border-top: 0.5px solid var(--border-tertiary);
      padding-top: 1rem;
      margin-top: 1rem;
      line-height: 1.6;
    }

    .restart-wrap {
      text-align: center;
      margin-top: 1rem;
    }

    .invisible { visibility: hidden; }

    @media (max-width: 480px) {
      body { padding: 1rem 0.75rem; }
      .bar-label { min-width: 100px; font-size: 11px; }
    }
  </style>
</head>

/* ─── State ──────────────────────────────────────────────────────────────── */
let lang = 'en';
let current = 0;
let answers = {};

/* ─── Helpers ────────────────────────────────────────────────────────────── */
function L() { return LANGS[lang]; }

function getScore() {
  return L().questions.reduce((s, q) => s + (answers[q.id] || 0), 0);
}

function getCatScores() {
  const cats = {};
  L().questions.forEach(q => {
    cats[q.cat] = (cats[q.cat] || 0) + (answers[q.id] || 0);
  });
  return cats;
}

/* ─── Render ─────────────────────────────────────────────────────────────── */
function renderLangBar() {
  document.getElementById('langBar').innerHTML = Object.keys(LANGS).map(k =>
    `<button class="lang-btn${lang === k ? ' active' : ''}" onclick="switchLang('${k}')">${LANGS[k].name}</button>`
  ).join('');
}

function updateHeader() {
  document.getElementById('headerTitle').textContent = L().title;
  document.getElementById('headerSubtitle').textContent = L().subtitle;
}

function render() {
  updateHeader();
  const qs = L().questions;
  const answered = Object.keys(answers).length;
  const finished = current >= qs.length && answered === qs.length;

  if (finished) { renderResult(); return; }

  const q = qs[Math.min(current, qs.length - 1)];
  const pct = (current / qs.length) * 100;
  const isLast = current === qs.length - 1;

  document.getElementById('quizArea').innerHTML = `
    <div class="progress-wrap">
      <div class="progress-label">${L().progress(answered, qs.length)}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="question-card">
      <div class="q-num">${L().qLabel} ${q.id} ${L().of} ${qs.length}</div>
      <div class="q-text">${q.text}</div>
      <div class="options">
        ${L().opts.map((lbl, v) => `
          <button class="opt${answers[q.id] === v ? ' selected' : ''}" onclick="selectAnswer(${q.id}, ${v})">
            <div class="opt-radio"></div>
            <span>${lbl}</span>
          </button>
        `).join('')}
      </div>
    </div>
    <div class="nav">
      <button class="btn${current === 0 ? ' invisible' : ''}" onclick="goBack()">${L().prev}</button>
      <button class="btn btn-primary" onclick="goNext()" ${answers[q.id] === undefined ? 'disabled' : ''}>
        ${isLast ? L().submit : L().next}
      </button>
    </div>
  `;
}

function renderResult() {
  const score = getScore();
  const max = 30;
  const pct = Math.round((score / max) * 100);
  const lvl = score <= 7 ? 0 : score <= 14 ? 1 : score <= 21 ? 2 : 3;
  const colors = ['#1D9E75', '#378ADD', '#BA7517', '#D85A30'];
  const color = colors[lvl];
  const catScores = getCatScores();
  const cats = L().categories;

  const r = 34, cx = 40, cy = 40;
  const circ = +(2 * Math.PI * r).toFixed(2);
  const dash = +((circ * pct) / 100).toFixed(2);
  const offset = +(circ / 4).toFixed(2);

  document.getElementById('quizArea').innerHTML = `
    <div class="result">
      <svg class="score-ring" viewBox="0 0 80 80" aria-hidden="true">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--border-tertiary)" stroke-width="6"/>
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="6"
          stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${offset}"
          stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/>
        <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="14" font-weight="500" fill="${color}">${score}</text>
      </svg>
      <div class="score-num">${score} <span>${L().scoreLabel}</span></div>
      <div class="score-label">${pct}%</div>
      <div class="result-level" style="color:${color}">${L().levels[lvl]}</div>
      <div class="result-desc">${L().levelDescs[lvl]}</div>
      <div class="breakdown">
        <div class="breakdown-title">${L().breakdown}</div>
        ${Object.keys(cats).map(k => {
          const s = catScores[k] || 0;
          const w = Math.round((s / 6) * 100);
          return `<div class="bar-row">
            <div class="bar-label">${cats[k]}</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
            <div class="bar-val">${s}/6</div>
          </div>`;
        }).join('')}
      </div>
      <div class="restart-wrap">
        <button class="btn btn-primary" onclick="restartQuiz()">${L().restart}</button>
      </div>
      <div class="disclaimer">${L().disclaimer}</div>
    </div>
  `;
}

/* ─── Actions ────────────────────────────────────────────────────────────── */
function switchLang(l) {
  lang = l;
  renderLangBar();
  render();
}

function selectAnswer(qid, val) {
  answers[qid] = val;
  render();
}

function goNext() {
  const qs = L().questions;
  if (answers[qs[current].id] === undefined) return;
  if (current < qs.length - 1) { current++; render(); }
  else if (Object.keys(answers).length === qs.length) { current = qs.length; render(); }
}

function goBack() {
  if (current > 0) { current--; render(); }
}

function restartQuiz() {
  current = 0;
  answers = {};
  render();
}

/* ─── Boot ───────────────────────────────────────────────────────────────── */
renderLangBar();
render();
</script>
